{% macro DisplayAddress(component) %}
  {% if component.model.attributes.inset %}
    <div class="govuk-inset-text">
      <p class="govuk-body">{{ component.model.content | replace(", ", "<br>") | replace(",", "<br>") | safe }}</p>
    </div>
  {% else %}
    <p class="govuk-body">{{ component.model.content | replace(", ", "<br>") | replace(",", "<br>") | safe }}</p>
  {% endif %}
{% endmacro %}
