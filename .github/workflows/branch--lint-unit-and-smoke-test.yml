name: Branch QA
on:
  pull_request:
    branches:
      - main
      - beta
      - v2
    paths-ignore:
      - "docs/**"
      - "**/README.md"
  workflow_dispatch:

jobs:
  dependencies:
    uses: ./.github/workflows/dependabot.yml
    secrets: inherit
  lint-and-test:
    needs: [dependencies]
    if: ${{!contains(github.event.head_commit.message, 'chore(deps-dev)')}}
    name: Workspace
    strategy:
      matrix:
        workspace: [runner]
    uses: ./.github/workflows/lint-and-test.yml
    with:
      workspace: ${{ matrix.workspace }}

  build-runner:
    name: Runner
    uses: ./.github/workflows/build.yml
    with:
      app: runner
    secrets: inherit

  smoke-test:
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
