# This file brings some extra configuration needed for local dev environment
# To start your local dev environment please run:
#    docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
version: "3.9"
services:
  designer:
    volumes:
      - /usr/src/app/node_modules
      - /usr/src/app/model/node_modules
      - /usr/src/app/model/dist
      - /usr/src/app/designer/node_modules
      - /usr/src/app/designer/dist
      - /usr/src/app/runner/node_modules
      - /usr/src/app/runner/dist
      - ./designer:/usr/src/app/designer:delegated
    command: yarn designer dev
  runner:
    volumes:
      - /usr/src/app/node_modules
      - /usr/src/app/model/node_modules
      - /usr/src/app/model/dist
      - /usr/src/app/designer/node_modules
      - /usr/src/app/designer/dist
      - /usr/src/app/runner/node_modules
      - /usr/src/app/runner/dist
      - ./runner:/usr/src/app/runner
    command: yarn runner dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SESSION_COOKIE_PASSWORD=604c565d2037e89c5fc3ed6bb20343148ccd2e5aa1abb93d
      # Forms can reference ${VAR_NAME} placeholders (e.g. addressLookupConfig in
      # order-a-radon-risk-report.json). In development these are resolved from
      # environment variables of the same name by resolvePlaceholders.ts.
      - RPS_API_BASE_URL=http://localhost
      - RPS_TENANT_ID=test
      - RPS_CLIENT_ID=test-client
      - RPS_CLIENT_SECRET=test-secret
      - RPS_SCOPES=test-scope
      - WEBHOOK_OUTPUT_URL=http://host.docker.internal:3000/h/xdaq71jj
