# This file brings some extra configuration needed for local dev environment
# To start your local dev environment please run:
#    docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
version: "3.9"
services:
  designer:
    volumes:
      - /usr/src/app/node_modules
      - /usr/src/app/model/node_modules
      - /usr/src/app/model/dist
      - /usr/src/app/designer/node_modules
      - /usr/src/app/designer/dist
      - /usr/src/app/runner/node_modules
      - /usr/src/app/runner/dist
      - ./designer:/usr/src/app/designer:delegated
    command: yarn designer dev
  runner:
    volumes:
      - /usr/src/app/node_modules
      - /usr/src/app/model/node_modules
      - /usr/src/app/model/dist
      - /usr/src/app/designer/node_modules
      - /usr/src/app/designer/dist
      - /usr/src/app/runner/node_modules
      - /usr/src/app/runner/dist
      - ./runner:/usr/src/app/runner
    command: yarn runner dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Forms can reference ${VAR_NAME} placeholders (e.g. services in
      # order-a-radon-risk-report.json). In development these are resolved from
      # environment variables of the same name by resolveDevPlaceholders.ts.

      # ==============================
      # ====== Common Variables ======
      # ==============================

      - SESSION_COOKIE_PASSWORD
      - ENABLE_MOCK_API

      # ------ Location services via UKHSA Azure ------

      - RPS_LOCATION_SERVICES_API_BASE_URL
      - RPS_LOCATION_SERVICES_API_TENANT_ID
      - RPS_LOCATION_SERVICES_API_CLIENT_ID
      - RPS_LOCATION_SERVICES_API_CLIENT_SECRET
      - RPS_LOCATION_SERVICES_API_SCOPES

      # ------ Trust Payments Service ------

      - RPS_ORR_TRUST_PAYMENTS_SITE_REFERENCE
      - RPS_GTK_TRUST_PAYMENTS_SITE_REFERENCE

      - RPS_ORR_TRUST_PAYMENTS_HASH_PASSWORD
      - RPS_GTK_TRUST_PAYMENTS_HASH_PASSWORD

      # ====================================
      # ====== App Specific Variables ======
      # ====================================

      # ------ RPS URLS ------

      - RPS_AWS_APIGW_BASE_URL

      # ------ RPS AWS Authoriser ------

      - RPS_AWS_AUTHORISER_API_TENANT_ID
      - RPS_AWS_AUTHORISER_API_CLIENT_ID
      - RPS_AWS_AUTHORISER_API_CLIENT_SECRET
      - RPS_AWS_AUTHORISER_API_SCOPES
